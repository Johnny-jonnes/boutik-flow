<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Dégradé horizontal : Rouge (gauche) -> Jaune (centre) -> Vert (droite) -->
    <linearGradient id="bf-guinea-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#009460"/>
    </linearGradient>
  </defs>
  <!-- Hexagone principal -->
  <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="url(#bf-guinea-h)"/>
  <!-- Contour subtil -->
  <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <!-- Monogramme BF -->
  <text x="50" y="62" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="38" fill="white" text-anchor="middle" letter-spacing="-3">BF</text>
  <!-- Ligne d'accent -->
  <rect x="22" y="76" width="56" height="3.5" rx="1.75" fill="#009460" opacity="0.8"/>
</svg>
