<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#009460"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#CE1126"/>
    </linearGradient>
    <clipPath id="hex-clip">
      <polygon points="50,3 93,26 93,74 50,97 7,74 7,26"/>
    </clipPath>
  </defs>
  <!-- Fond hexagonal dégradé guinéen -->
  <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="url(#bg-grad)"/>
  <!-- Contour subtil -->
  <polygon points="50,3 93,26 93,74 50,97 7,74 7,26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <!-- Monogramme BF en blanc -->
  <!-- B -->
  <text x="18" y="66" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="46" fill="white" letter-spacing="-4">BF</text>
  <!-- Ligne décorative rouge en bas -->
  <rect x="20" y="75" width="60" height="4" rx="2" fill="#CE1126" opacity="0.7"/>
</svg>
